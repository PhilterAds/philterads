# Weekly filter-list refresh: rebuilds rulesets/ + cosmetic/ from the
# upstream lists, proves them with the test suite and the shrink guard, then
# commits and pushes them (bumping the manifest patch version) so the
# extension's "Check for updates" button has something to pull.
#
# Also runnable by hand: Actions tab -> refresh-lists -> Run workflow.

name: refresh-lists

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

permissions: {} # nothing by default; the job below asks for exactly what it needs

concurrency:
  group: refresh-lists
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'PhilterAds/philterads' # forks never run the scheduled push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the refreshed lists to main
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # smoke never runs in CI; skip its browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:rules
      - run: npm test
      - run: node tools/check-shrink.mjs # tests or guard fail -> nothing below runs, nothing is committed
      - name: Commit and push refreshed lists
        run: node tools/commit-lists.mjs
